name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        validation: ['0.2.2', '0.3.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction 'denosyscore/validation:${{ matrix.validation }}'
          composer install --no-interaction --prefer-dist

      - name: Run HTTP tests
        run: composer test

      - name: PHP syntax check
        run: |
          if [ -d src ]; then
            find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "No src/ directory to lint."
          fi

  session-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate integration manifest
        working-directory: integration/session
        run: composer validate --strict --no-check-publish

      - name: Install integration dependencies
        working-directory: integration/session
        run: composer install --no-interaction --prefer-dist

      - name: Run real session middleware check
        working-directory: integration/session
        run: php session-middleware.php
